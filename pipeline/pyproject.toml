[project]
name = "mathlibmap-pipeline"
version = "0.1.0"
description = "Data pipeline for Mathlib Map: fetch public Mathlib datasets, join, classify, rank, shard, upload."
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6",
  "huggingface-hub>=0.25",
  "numpy>=2.5.2",
  "scipy>=1.18.1",
]

[project.scripts]
mathlibmap = "mathlibmap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathlibmap"]
