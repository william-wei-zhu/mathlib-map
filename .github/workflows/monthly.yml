name: Monthly data refresh

# Rebuilds every shard from the pinned Mathlib tag and uploads it to the public bucket.
# Runs on the 3rd of each month and on demand. A dry run does everything except upload.
# Required secret: GCP_SA_KEY (JSON key of mathlibmap-ci@mathlibmap.iam.gserviceaccount.com,
# roles: storage.objectAdmin on gs://mathlibmap-data, aiplatform.user on project mathlibmap).

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but do not upload"
        type: boolean
        default: true
      mathlib_tag:
        description: "Mathlib tag to build against (blank = the pinned one)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Pin a different Mathlib tag (dispatch only)
        if: ${{ github.event.inputs.mathlib_tag != '' }}
        env:
          TAG: ${{ github.event.inputs.mathlib_tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-rc[0-9]*) ;; *) echo "not a Mathlib tag: $TAG"; exit 1;; esac
          sed -i "s/^rev = \".*\"/rev = \"$TAG\"/" extractor/lakefile.toml
          curl -sfL "https://raw.githubusercontent.com/leanprover-community/mathlib4/$TAG/lean-toolchain" > extractor/lean-toolchain
          sed -i "s/^mathlibTag: .*/mathlibTag: $TAG/" data/curated/snapshot.yaml
          sed -i "s/^date: .*/date: \"$(date -u +%F)\"/" data/curated/snapshot.yaml

      - name: Install elan and build the extractor with Mathlib's cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: extractor
          use-mathlib-cache: true
          auto-config: false
          build-args: "--no-ansi"

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Restore the classification cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache/msc
          key: msc-cache-${{ hashFiles('extractor/lakefile.toml', 'pipeline/mathlibmap/msc.py') }}
          restore-keys: msc-cache-

      - name: Fetch public inputs
        working-directory: pipeline
        run: uv run mathlibmap fetch

      - name: Extract records and dependencies from Mathlib
        working-directory: extractor
        run: |
          mkdir -p ../pipeline/cache/extract
          lake exe extractor --modules Mathlib --out ../pipeline/cache/extract/mathlib.ndjson
          lake exe extractor --mode deps --modules Mathlib --out ../pipeline/cache/extract/deps.ndjson

      - name: Classify modules (cached; only changed files hit the model)
        working-directory: pipeline
        run: uv run mathlibmap classify

      - name: Build the three views
        working-directory: pipeline
        run: |
          uv run mathlibmap hierarchy
          uv run mathlibmap atlas
          uv run mathlibmap map
          uv run mathlibmap hierarchy
          uv run mathlibmap map

      - name: Sanity checks
        working-directory: pipeline
        run: uv run pytest -q

      - name: Upload
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        working-directory: pipeline
        run: |
          for d in hierarchy map atlas downloads root; do uv run mathlibmap upload "$d"; done

      - name: Report
        working-directory: pipeline
        run: cat out/root/meta.json
